[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "skillspector-quality"
version = "0.1.0"
description = "Deterministic authoring quality scorer for Claude Code skills. Rates SKILL.md bundles 0–100 across nine dimensions: information density, readability, topic coverage, structural coherence, code maintainability, and more"
readme = "README.md"
license = "MIT"
requires-python = ">=3.11"
keywords = ["skills", "quality", "rating", "claude-code", "skillspector"]
dependencies = [
    "typer>=0.12,<2",
    "rich>=14.3.0",
    "pyyaml>=6.0.1",
    "fastapi>=0.115",
    "uvicorn[standard]>=0.30",
    "python-dotenv>=1.0",
    "python-multipart>=0.0.9",
    "langgraph>=0.2",
    "langchain-core>=0.3",
]

[project.scripts]
skillspector-quality = "skillspector_quality.cli:app"

[project.optional-dependencies]
code = [
    "radon>=6.0",
]
dev = [
    "pytest>=9.0.0",
    "pytest-cov>=4.0",
    "ruff>=0.15.0",
    "mypy>=1.19.0",
    "radon>=6.0",
]

[tool.hatch.build.targets.wheel]
# The skillspector fallback now lives inside the skillspector_quality package
# (_skillspector_fallback/) and is registered at runtime only when the real
# SkillRater package is absent (https://github.com/larsroettig/SkillRater).
packages = ["src/skillspector_quality"]

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "W", "I", "N", "UP", "B", "C4"]
ignore = ["E501"]

[tool.ruff.format]
quote-style = "double"
indent-style = "space"
